model:
  id: "Qwen/Qwen3-0.6B"
  revision: "c1899de289a04d12100db370d81485cdf75e47ca"
  dtype: "bfloat16"

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  seed: 42
  max_length: 512
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  epochs: 3
  learning_rate: 0.0002
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 5
  save_strategy: "epoch"

experiment:
  hypothesis: "Un rang LoRA plus bas (r=8, alpha=16) réduit le surapprentissage sur 320 exemples et améliore la généralisation JSON sur la validation."
  changed_variable: "lora.r (et alpha pour conserver alpha=2*r)"
  expected_effect: "Meilleur ou égal score de schéma / lexical vs référence r=16, avec moins d'écarts severity."
