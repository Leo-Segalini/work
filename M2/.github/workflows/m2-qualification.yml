name: M2 Qualification

on:
  push:
    branches: [main]
    paths:
      - "work/M2/**"
      - "data_pack/2026-S1/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  socle:
    name: Socle publié (succès attendu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work/M2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Tests non-régression M2
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Audit socle publié
        env:
          PYTHONPATH: .
        run: |
          python -m src.data_pipeline \
            --input ../../data_pack/2026-S1 \
            --output ./output/ci_baseline

      - name: Résumé socle
        if: always()
        run: |
          echo "## Qualification M2 — socle" >> $GITHUB_STEP_SUMMARY
          echo "Tests + audit publié : OK" >> $GITHUB_STEP_SUMMARY

  candidate:
    name: Lot candidat (rejet attendu r2)
    runs-on: ubuntu-latest
    needs: socle
    defaults:
      run:
        working-directory: work/M2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Qualification livraison candidate (--strict)
        id: qualify
        env:
          PYTHONPATH: .
        run: python scripts/qualify_candidate.py --strict
        continue-on-error: true

      - name: Résumé qualification
        if: always()
        run: |
          echo "## Qualification M2 — candidate" >> $GITHUB_STEP_SUMMARY
          if [ -f output/candidate_qualification/qualification_report.json ]; then
            python -c "import json; d=json.load(open('output/candidate_qualification/qualification_report.json')); print(f\"Décision: {d['decision']} | Bloquants: {d['blocking']}\")" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.qualify.outcome }}" = "failure" ]; then
            echo "Statut job : rejet métier (--strict) — attendu sur le lot pédagogique r2." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-qualification-reports
          path: |
            work/M2/output/candidate_qualification/
            work/M2/aller_plus_loin/run_manifest.json

      - name: Échec si qualification inattendue
        run: |
          decision=$(python -c "import json; print(json.load(open('output/candidate_qualification/qualification_report.json'))['decision'])")
          if [ "$decision" != "REJECTED" ]; then
            echo "Décision inattendue: $decision (REJECTED attendu sur r2)"
            exit 1
          fi
          if [ "${{ steps.qualify.outcome }}" != "failure" ]; then
            echo "Le mode --strict aurait dû échouer sur REJECTED"
            exit 1
          fi
